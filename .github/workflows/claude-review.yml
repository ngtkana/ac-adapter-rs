name: Claude Code PR Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # 静的なAPIキーの代わりにWorkload Identity Federationを使う（GitHub ActionsのOIDCトークンを短期アクセストークンに交換する）。
          # anthropic_api_key と併用すると静的キーが優先されfederationが使われなくなるため、両方を設定しないこと。
          anthropic_federation_rule_id: fdrl_01B8UepWdqiDe43tUKaP2rbu
          anthropic_organization_id: 797c3154-972f-4033-b7a7-b1df5629e3d4
          anthropic_service_account_id: svac_0186LW9Ad8LRr72yMD26mNC5
          anthropic_workspace_id: wrkspc_01CQgj6LwnfWxQcWs9dbRJUQ
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            LANGUAGE: ja

            このPRの差分をレビューしてください。
            - バグ、設計上の問題、改善点があれば日本語で具体的に指摘する
            - 指摘が無ければその旨を簡潔に述べる

            レビューコメントの最後に、区切り線を挟んで次のリンクを追記する:
            [Anthropic Console で使用量を確認](https://console.anthropic.com)
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(gh pr diff:*),Read,Grep,Glob"
