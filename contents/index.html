<html lang="ja">

<head>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

<body>
  <div id="app">
    <header id="toolbar">
      <h1>AC Adapter</h1>
      <span class="subtitle">競技プログラミングのための Rust ライブラリコレクション</span>
      <a class="toolbar-link" href="https://github.com/ngtkana/ac-adapter-rs" target="_blank">GitHub</a>
    </header>

    <div id="main-layout">
      <aside class="catalog-sidebar">
        <div class="catalog-search">
          <input type="text" id="search-input" placeholder="segtree / tag:string ..." />
          <div class="hint">名前・説明・アイテム名で全文検索。<code>tag:xxx</code> でタグ絞り込み</div>
        </div>
        <div class="catalog-list" id="catalog-list"></div>
      </aside>

      <main class="catalog-main" id="catalog-main">
        <p class="placeholder">左の一覧からクレートを選んでください。</p>
      </main>
    </div>

    <footer id="shortcuts-bar">
      <span><kbd>j</kbd>/<kbd>k</kbd> 前後のクレートに移動</span>
      <span><kbd>/</kbd> 検索欄にフォーカス</span>
      <span><kbd>Esc</kbd> 検索欄を離れる</span>
    </footer>
  </div>
