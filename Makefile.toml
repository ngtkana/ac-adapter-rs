[config]
default_to_workspace = false

[tasks.ci-flow]
dependencies = ["test-doc", "clippy", "test", "docs"]


[tasks.check]
command = "cargo"
args = ["check", "--all-features", "--all-targets"]

[tasks.test]
command = "cargo"
args = ["nextest", "run"]

[tasks.test-doc]
command = "cargo"
args = ["test", "--doc"]

[tasks.doc]
script = '''
cargo run --bin snippetter
if [ ! -e "docs" ]; then
    mkdir -p "docs"
fi
cp contents/* docs/
if [ ! -e "docs/rustdoc" ]; then
    mkdir -p "docs/rustdoc"
fi
RUSTDOCFLAGS="--html-in-header contents/header.html -D rustdoc::broken_intra_doc_links" \
    cargo doc --workspace --no-deps
cp -r target/doc/* docs/rustdoc/
'''

[tasks.clippy]
command = "cargo"
args = ["clippy", "--all-features", "--all-targets"]

[tasks.pedantics]
script = '''
cargo clippy --all-targets --all-features -- -W clippy::pedantic 2>&1 | grep 'note: `-W clippy::' | sed -n 's/.*note: `-W clippy::\([a-z|-]*\).*/\1/p' | sort | uniq
'''

[tasks.install-acbundle]
description = "Install the `acbundle` binary to ~/.cargo/bin (usable from any directory, e.g. rust-atcoder)"
script = '''
cargo install --path bundler --locked --force
echo ""
case "$SHELL" in
    */zsh) RC="~/.zshrc" ;;
    */bash) RC="~/.bashrc" ;;
    *) RC="your shell's rc file" ;;
esac
DIR="$(pwd)"
case "$DIR" in
    "$HOME"/*) DIR="\$HOME${DIR#"$HOME"}" ;;
esac
echo "Add this to $RC (detected from \$SHELL=$SHELL) if not already present:"
echo ""
echo "    export AC_ADAPTER_RS_ROOT=\"$DIR\""
echo ""
'''

[tasks.uninstall-acbundle]
description = "Uninstall the `acbundle` binary"
script = '''
cargo uninstall bundler
echo ""
case "$SHELL" in
    */zsh) RC="~/.zshrc" ;;
    */bash) RC="~/.bashrc" ;;
    *) RC="your shell's rc file" ;;
esac
echo "Don't forget to also remove the AC_ADAPTER_RS_ROOT export (and, if added, the"
echo "bundler completion source line) from $RC."
echo ""
'''

[tasks.dev]
script = '''
cd docs && python3 -m http.server 8000
'''
description = "Serve documentation locally at http://localhost:8000"

[tasks.hooks-install]
script = '''
chmod +x .githooks/pre-commit
git config core.hooksPath .githooks
echo "Pre-commit hooks installed (core.hooksPath = .githooks)"
'''
description = "Install local pre-commit git hooks"
